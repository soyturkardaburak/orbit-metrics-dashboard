<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit Metrics is a fictional analytics dashboard for Northline Supply. See the bigger picture."
    />
    <meta name="theme-color" content="#070d1a" />
    <title>Orbit Metrics — See the bigger picture.</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var raw = localStorage.getItem('orbit-metrics-preferences')
        var theme = raw && JSON.parse(raw).state.prefs.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {
        /* keep the default dark theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
